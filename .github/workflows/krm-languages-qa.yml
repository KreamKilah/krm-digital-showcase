name: KRM Languages Browser QA
on:
  push:
    paths:
      - index.html
      - i18n.js
      - tests/i18n-smoke.cjs
      - tests/brief-builder-smoke.cjs
      - tests/proposal-preview-smoke.cjs
      - tests/site-integrity.cjs
      - tests/visual-capture.cjs
      - brief-builder/**
      - .github/workflows/krm-languages-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static release quality gate
        run: node tests/site-integrity.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test 3 languages, preview, brief and mobile layout
        run: |
          node tests/i18n-smoke.cjs
          node tests/brief-builder-smoke.cjs
          node tests/proposal-preview-smoke.cjs
      - name: Capture visual QA screenshots
        run: node tests/visual-capture.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krm-visual-qa
          path: qa-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
