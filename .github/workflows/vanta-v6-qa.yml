name: VANTA V6 from-scratch editorial QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test layout, menu, service selector, ticket demo, and motion
        run: node barber-v6-preview/tests/smoke.cjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanta-v6-editorial-qa
          path: v6-qa/
          retention-days: 7
