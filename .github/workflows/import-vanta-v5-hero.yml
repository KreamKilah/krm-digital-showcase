name: Import VANTA V5 original hero
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download own original hero
        env:
          HERO_SOURCE: ${{ secrets.VANTA_V5_HERO_URL }}
        run: |
          mkdir -p assets
          curl --fail --location --retry 2 --max-time 130 "$HERO_SOURCE" -o /tmp/vanta-v5.png
          test "$(wc -c < /tmp/vanta-v5.png)" -gt 30000
          file /tmp/vanta-v5.png | grep -q 'PNG image'
      - name: Optimize hero to modern permanent WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/vanta-v5.png')
          im.thumbnail((2000,1250))
          im.convert('RGB').save('assets/vanta-v5-hero.webp','WEBP',quality=84,method=6)
          PY
      - name: Commit original asset only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vanta-v5-hero.webp
          if git diff --cached --quiet; then echo "Already present"; exit 0; fi
          git commit -m "Add original VANTA V5 luxury barber hero"
          git pull --rebase origin main
          git push origin HEAD:main
