name: ORLA Mediterranean visual QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test ORLA at five widths
        run: node orla-mediterranean/tests/smoke.cjs
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orla-mediterranean-visual-qa
          path: orla-qa/
          retention-days: 7
