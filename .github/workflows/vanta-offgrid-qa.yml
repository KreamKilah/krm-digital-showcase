name: VANTA OFFGRID visual QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test OFFGRID 360 390 768 1024 1440
        run: node vanta-v6-offgrid/tests/smoke.cjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanta-offgrid-visual-evidence
          path: offgrid-qa/
          retention-days: 7
