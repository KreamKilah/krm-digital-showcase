name: Import approved KRM visual identity (one-time)
on:
  workflow_dispatch:
    inputs:
      horizontal:
        description: "One-time approved KRM horizontal logo image URL"
        required: true
        type: string
      principal:
        description: "One-time approved KRM principal mark image URL"
        required: true
        type: string
      avatar:
        description: "One-time approved KRM avatar image URL"
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved artwork sources
        env:
          HORIZONTAL_URL: ${{ inputs.horizontal }}
          PRINCIPAL_URL: ${{ inputs.principal }}
          AVATAR_URL: ${{ inputs.avatar }}
        run: |
          mkdir -p brand
          curl --fail --location --retry 2 --max-time 90 "$HORIZONTAL_URL" -o /tmp/krm-horizontal.png
          curl --fail --location --retry 2 --max-time 90 "$PRINCIPAL_URL" -o /tmp/krm-principal.png
          curl --fail --location --retry 2 --max-time 90 "$AVATAR_URL" -o /tmp/krm-avatar.png
          test "$(wc -c < /tmp/krm-horizontal.png)" -gt 1000
          test "$(wc -c < /tmp/krm-principal.png)" -gt 1000
          test "$(wc -c < /tmp/krm-avatar.png)" -gt 1000
      - name: Write permanent optimized branding assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          import os
          for key in ('horizontal','principal','avatar'):
              image=Image.open(f'/tmp/krm-{key}.png').convert('RGBA')
              image.save(f'brand/krm-{key}.png',optimize=True)
          avatar=Image.open('brand/krm-avatar.png').convert('RGBA')
          avatar.save('brand/favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          print('KRM imported:', [(f, Image.open('brand/'+f).size) for f in ('krm-horizontal.png','krm-principal.png','krm-avatar.png')])
          PY
      - name: Save approved brand assets permanently to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/krm-horizontal.png brand/krm-principal.png brand/krm-avatar.png brand/favicon.ico
          git commit -m "Add approved KRM DIGITAL logo family" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
